<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corazón en movimiento</title>
  <style>
    :root{
      --bg:#0f1724;
      --accent:#ff416c;
      --accent-2:#ff758c;
    }
    html,body{height:100%;margin:0}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(255,65,108,0.07), transparent),
                  linear-gradient(180deg,#071029 0%, var(--bg) 100%);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      color:#fff;
      overflow:hidden;
    }

    .stage{width:100%;height:100%;position:relative;}

    .heart{
      width:150px;height:150px;
      position:absolute;left:-20%;top:50%;
      transform:translateY(-50%);
      filter:drop-shadow(0 10px 30px rgba(0,0,0,0.45));
      animation: travel 8s linear infinite, beat 0.8s ease-in-out infinite;
      cursor:pointer;
    }
    @media (max-width:600px){.heart{width:110px;height:110px}}

    @keyframes travel{
      0%{left:-20%; top:65%; transform:translateY(-50%) scale(1)}
      25%{left:20%; top:40%; transform:translateY(-50%) scale(1.03) rotate(-6deg)}
      50%{left:50%; top:55%; transform:translateY(-50%) scale(1.05)}
      75%{left:80%; top:35%; transform:translateY(-50%) scale(1.03) rotate(6deg)}
      100%{left:120%; top:50%; transform:translateY(-50%) scale(1)}
    }
    @keyframes beat{
      0%{transform:translateY(-50%) scale(1)}
      25%{transform:translateY(-50%) scale(1.08)}
      40%{transform:translateY(-50%) scale(0.95)}
      60%{transform:translateY(-50%) scale(1.06)}
      100%{transform:translateY(-50%) scale(1)}
    }
    .fill-gradient stop:nth-child(1){stop-color:var(--accent)}
    .fill-gradient stop:nth-child(2){stop-color:var(--accent-2)}

    .particle{
      position:absolute;
      width:4px;height:4px;
      background:#fff;
      border-radius:50%;
      pointer-events:none;
    }
    .message{
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      font-size:20px;
      font-weight:700;
      opacity:0;
      transition:opacity 1s ease;
      max-width:90%;
    }
    .hint{
      position:absolute;
      top:10%;left:50%;
      transform:translateX(-50%);
      font-size:18px;font-weight:600;
      opacity:0.8;
      animation: blink 1.2s infinite;
    }
    @keyframes blink{0%,100%{opacity:0.8}50%{opacity:0.2}}

    /* estrellas */
    .star{
      position:absolute;
      width:2px;height:2px;
      background:#fff;
      border-radius:50%;
      animation: twinkle 2s infinite;
    }
    @keyframes twinkle{0%,100%{opacity:1}50%{opacity:0.2}}

    /* cohete */
    .rocket{
      position:absolute;
      left:50%;bottom:-150px;
      width:40px;height:80px;
      background:linear-gradient(to top,#ccc,#fff);
      border-radius:20px 20px 5px 5px;
      transform:translateX(-50%);
      z-index:10;
    }
    .rocket::before{
      content:'';
      position:absolute;
      bottom:-20px;left:50%;
      transform:translateX(-50%);
      width:20px;height:20px;
      background:orange;
      border-radius:50%;
      box-shadow:0 0 15px 5px orange;
    }
    .smoke{
      position:absolute;
      bottom:-25px;
      left:50%;
      width:15px;height:15px;
      background:rgba(255,255,255,0.7);
      border-radius:50%;
      transform:translateX(-50%);
    }

    /* mensaje final */
    .final-message{
      position:absolute;
      top:70%;left:50%;
      transform:translate(-50%,-50%);
      font-size:24px;font-weight:bold;
      color:#ff4cff;
      text-shadow:0 0 10px #ff4cff,0 0 20px #ff4cff;
      opacity:0;
      animation: neonPulse 1.5s infinite;
    }
    @keyframes neonPulse{
      0%,100%{text-shadow:0 0 5px #ff4cff,0 0 10px #ff4cff,0 0 20px #ff4cff}
      50%{text-shadow:0 0 20px #ff4cff,0 0 40px #ff4cff}
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="hint" id="hint">Haz clic en el corazón hasta que explote 💥</div>
    <svg class="heart" id="heart" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%" class="fill-gradient">
          <stop offset="0%" stop-color="#ff416c" />
          <stop offset="100%" stop-color="#ff758c" />
        </linearGradient>
      </defs>
      <path fill="url(#g)" d="M471.701,73.333c-52.8-45.333-131.2-38.667-180.533,11.2L256,120.533l-35.168-35.968C166.4,34.667,88,28,35.2,73.333
        C-18.133,120.533-9.067,209.067,43.2,261.333L236.8,455.467c6.4,6.4,17.067,6.4,23.467,0L468.8,261.333
        C522.133,209.067,531.2,120.533,471.701,73.333z" />
    </svg>
    <div class="message" id="message">Te amo tanto que siempre buscaré la manera de darte este tipo de cosas ❤️</div>
  </div>

  <script>
    const heart=document.getElementById('heart');
    const stage=document.getElementById('stage');
    const message=document.getElementById('message');
    const hint=document.getElementById('hint');
    let particles=[];

    heart.addEventListener('click', ()=>{
      heart.animate([
        { transform:'translateY(-50%) scale(1)' },
        { transform:'translateY(-50%) scale(1.5)' },
        { transform:'translateY(-50%) scale(0)' }
      ],{duration:1000,easing:'ease-in-out'}).onfinish=()=>{
        heart.style.visibility='hidden';
        hint.style.display='none';
        createExplosion();
      };
    });

    function createExplosion(){
      const numParticles=120;
      particles=[];
      for(let i=0;i<numParticles;i++){
        const p=document.createElement('div');
        p.className='particle';
        stage.appendChild(p);
        particles.push(p);
        p.style.left='50%';p.style.top='50%';
        const angle=Math.random()*2*Math.PI;
        const radius=Math.random()*200+50;
        const x=Math.cos(angle)*radius;
        const y=Math.sin(angle)*radius;
        p.animate([{transform:`translate(0,0)`},{transform:`translate(${x}px,${y}px) rotate(720deg)`}],
        {duration:1500+Math.random()*500,easing:'ease-out',fill:'forwards'});
      }
      setTimeout(()=>{formHeart();},2000);
    }

    function formHeart(){
      const centerX=window.innerWidth/2;
      const centerY=window.innerHeight/2;
      const scale=10;
      particles.forEach((p,i)=>{
        const t=(i/particles.length)*Math.PI*2;
        const x=16*Math.pow(Math.sin(t),3);
        const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        const finalX=centerX+x*scale;
        const finalY=centerY-y*scale;
        p.animate([{transform:'translate(0,0)'},{transform:`translate(${finalX-centerX}px,${finalY-centerY}px)`}],
        {duration:2000,easing:'ease-in-out',fill:'forwards'});
      });
      setTimeout(()=>{message.style.opacity=1;},2500);
      setTimeout(()=>{launchRocket();},6000);
    }

    function createStars(){
      for(let i=0;i<100;i++){
        const star=document.createElement('div');
        star.className='star';
        star.style.left=Math.random()*100+'%';
        star.style.top=Math.random()*100+'%';
        stage.appendChild(star);
      }
    }

    function launchRocket(){
      stage.innerHTML=""; // limpiar
      createStars();
      const rocket=document.createElement('div');
      rocket.className='rocket';
      stage.appendChild(rocket);
      const finalMsg=document.createElement('div');
      finalMsg.className='final-message';
      finalMsg.textContent="Esto no lo hace cualquiera mi amor, espero que te guste 💖";
      stage.appendChild(finalMsg);

      rocket.animate([
        { bottom:'-150px' },
        { bottom:'50%', offset:0.7 },
        { bottom:'110%' }
      ],{duration:5000,easing:'ease-in-out',fill:'forwards'});

      const smokeInterval=setInterval(()=>{
        const smoke=document.createElement('div');
        smoke.className='smoke';
        rocket.appendChild(smoke);
        smoke.animate([
          { transform:'translateY(0) scale(1)', opacity:1 },
          { transform:'translateY(50px) scale(2)', opacity:0 }
        ],{duration:2000,fill:'forwards'});
        setTimeout(()=>smoke.remove(),2000);
      },200);

      setTimeout(()=>{
        clearInterval(smokeInterval);
        finalMsg.style.opacity=1;
      },5000);
    }
  </script>
</body>
</html>
