<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón animado</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      color: white;
      font-family: "Arial", sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #mensaje {
      font-size: 22px;
      text-align: center;
      display: none;
      max-width: 80%;
    }

    #instruccion {
      font-size: 20px;
      color: #ff4081;
      animation: parpadeo 1s infinite alternate;
      margin-top: -300px;
    }

    @keyframes parpadeo {
      from { opacity: 1; }
      to { opacity: 0.3; }
    }

    /* --- Escena final --- */
    #escenaFinal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
    }

    /* Estrellas */
    .estrella {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: brillar 2s infinite alternate;
    }

    @keyframes brillar {
      from { opacity: 0.2; }
      to { opacity: 1; }
    }

    /* Cohete centrado */
    .cohete {
      font-size: 60px;
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      animation: despegar 4s linear forwards;
      z-index: 2;
    }

    @keyframes despegar {
      0% { transform: translate(-50%, 0); }
      100% { transform: translate(-50%, -120vh); }
    }

    /* Humo justo debajo */
    .humo {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      opacity: 0.7;
      animation: humoSube 5s ease-in-out infinite;
    }

    @keyframes humoSube {
      0%   { transform: translate(-50%, 0) scale(1); opacity: 0.7; }
      50%  { transform: translate(-50%, -80px) scale(1.2); opacity: 0.4; }
      100% { transform: translate(-50%, -160px) scale(1.4); opacity: 0; }
    }

    /* Mensaje final */
    .mensajeFinal {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      color: #ff80ff;
      text-align: center;
      opacity: 0;
      text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff33cc, 0 0 20px #ff66ff;
      animation: aparecerMsg 2s ease-in-out forwards, latido 1.5s infinite;
      animation-delay: 5s, 7s; /* aparece y luego late */
      z-index: 3;
    }

    @keyframes aparecerMsg {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    @keyframes latido {
      0%   { transform: translateX(-50%) scale(1); }
      25%  { transform: translateX(-50%) scale(1.1); }
      50%  { transform: translateX(-50%) scale(1); }
      75%  { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="instruccion">💖 Haz clic en el corazón hasta que explote 💥</div>
  <div id="mensaje"></div>

  <!-- Escena final -->
  <div id="escenaFinal">
    <div id="cielo"></div>
    <div class="cohete">🚀</div>
    <div class="humo">💨</div>
    <div class="mensajeFinal">Esto no lo hace cualquiera mi amor, espero que te guste 💕</div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const mensaje = document.getElementById("mensaje");
    const instruccion = document.getElementById("instruccion");
    const escenaFinal = document.getElementById("escenaFinal");
    const cielo = document.getElementById("cielo");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let heartSize = 50;
    let clickCount = 0;
    let exploded = false;
    let particles = [];

    function drawHeart(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x, y - size / 2, x - size, y - size / 2, x - size, y);
      ctx.bezierCurveTo(x - size, y + size / 1.5, x, y + size, x, y + size * 1.5);
      ctx.bezierCurveTo(x, y + size, x + size, y + size / 1.5, x + size, y);
      ctx.bezierCurveTo(x + size, y - size / 2, x, y - size / 2, x, y);
      ctx.fillStyle = "#ff0044";
      ctx.fill();
      ctx.closePath();
    }

    function createParticles() {
      particles = [];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          angle: Math.random() * Math.PI * 2,
          speed: Math.random() * 5 + 2,
          size: 3,
          color: "hsl(" + Math.random() * 360 + ",100%,50%)"
        });
      }
    }

    function explodeParticles() {
      particles.forEach(p => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
      });
    }

    function heartPositions(numPoints) {
      let positions = [];
      for (let i = 0; i < numPoints; i++) {
        let t = Math.PI - (i / numPoints) * 2 * Math.PI;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        positions.push({
          x: canvas.width/2 + x * 15,
          y: canvas.height/2 - y * 15
        });
      }
      return positions;
    }

    let targetHeart = heartPositions(100);

    function regroupParticles() {
      particles.forEach((p, i) => {
        let target = targetHeart[i % targetHeart.length];
        p.x += (target.x - p.x) * 0.05;
        p.y += (target.y - p.y) * 0.05;
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!exploded) {
        drawHeart(canvas.width / 2, canvas.height / 2, heartSize);
      } else {
        explodeParticles();
        regroupParticles();
        particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      requestAnimationFrame(animate);
    }

    // estrellas
    function generarEstrellas(num) {
      for (let i = 0; i < num; i++) {
        let estrella = document.createElement("div");
        estrella.classList.add("estrella");
        estrella.style.top = Math.random() * 100 + "%";
        estrella.style.left = Math.random() * 100 + "%";
        estrella.style.animationDelay = Math.random() * 2 + "s";
        cielo.appendChild(estrella);
      }
    }

    canvas.addEventListener("click", () => {
      if (!exploded) {
        clickCount++;
        heartSize += 10;
        if (clickCount > 5) {
          exploded = true;
          createParticles();
          instruccion.style.display = "none";
          setTimeout(() => {
            mensaje.style.display = "block";
            mensaje.innerText = "Te amo tanto que siempre buscaré la manera de darte este tipo de cosas ❤️";
            setTimeout(() => {
              escenaFinal.style.display = "flex";
              generarEstrellas(80);
            }, 5000);
          }, 3000);
        }
      }
    });

    animate();
  </script>
</body>
</html>
